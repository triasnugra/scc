# ================= MODE =================
# signal = hanya kirim sinyal (tanpa order)  <- aman, cocok untuk GitHub Actions
# paper  = simulasi order dengan harga pasar nyata
# live   = order sungguhan (wajib env LIVE_CONFIRM=SAYA_PAHAM_RISIKONYA)
mode: signal

exchange: binance        # binance | bybit | hyperliquid
testnet: true            # TRUE dulu. Ubah ke false hanya setelah lolos uji testnet + paper
paper_equity: 1000       # modal virtual untuk mode paper/signal (USDT)

# Simbol perpetual (format ccxt). Hyperliquid: "BTC/USDC:USDC"
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
  - INJ/USDT:USDT
  - LTC/USDT:USDT

timeframes: { trigger: 15m, range: 1h, trend: 4h }

strategy:
  # --- Setup A: deviasi range + reclaim (materi: range H1, deviation high/low) ---
  range_lookback_1h: 48          # jam yang membentuk range
  range_skip_1h: 4               # jam terakhir tidak ikut range (zona deviasi)
  min_range_pct: 1.0             # range terlalu sempit = abaikan
  max_range_pct: 15.0
  dev_window_15m: 16             # sapuan harus terjadi dalam N candle 15m terakhir
  dev_min_pct: 0.03              # kedalaman minimal sapuan di luar level
  dev_max_pct: 1.5               # lebih dalam dari ini = breakdown, bukan deviasi
  extreme_zone: 0.35             # entry hanya di 35% bawah/atas range (anti mid-range)
  # --- Setup B: Fibonacci 0.75/0.786 (materi YouTube) ---
  fib_enabled: true
  fib_lookback_1h: 72
  fib_min_impulse_atr: 4.0       # impuls minimal 4x ATR(1h)
  fib_zone: [0.70, 0.786]
  # --- Umum ---
  sl_buffer_atr: 0.2             # buffer SL di luar sapuan, x ATR(15m)
  min_rr: 1.5                    # R:R minimal ke TP2 (setelah biaya)
  tp1_fraction: 0.5              # porsi ditutup di TP1, lalu SL geser ke break-even
  min_stop_pct: 0.25
  max_stop_pct: 3.0              # materi: stop leverage 2-4% maksimum
  trend_er_min: 0.25             # ER 4h di bawah ini = sideways -> bias netral
  min_score: 65
  volume_spike: 1.3
  orderbook_imbalance: 1.2
  btc_shock_pct: 1.5             # blok altcoin jika BTC bergerak melawan >X% dalam 3 jam
  max_chase_r: 0.25              # jangan masuk jika harga sudah lari >0.25R dari entry
  fee_bps_roundtrip: 10          # 0.10% total taker in+out (konservatif)
  slippage_bps: 3

risk:
  risk_per_trade_pct: 0.5        # % ekuitas yang dipertaruhkan per trade
  max_leverage: 5
  max_open_positions: 2
  max_trades_per_day: 3
  max_trades_per_hour: 1
  daily_loss_limit_pct: 2.0      # kena batas ini = berhenti sampai hari berikutnya (UTC)
  max_consecutive_losses: 3
  cooldown_after_loss_min: 60
  kill_switch_file: state/KILL   # buat file ini = bot berhenti membuka posisi baru

claude:
  enabled: true
  model: claude-sonnet-5-5
  min_confidence: 70
  max_tokens: 600

max_signal_age_min: 10          # sinyal dari candle yang sudah lebih tua dari ini diabaikan
loop_seconds: 60                 # hanya untuk --loop (VPS/Docker)
